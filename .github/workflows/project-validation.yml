name: Project Validation

on:
  push:
    branches:
      - main
      - automation-quality-checks
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -type f -name '*.js' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print0 | while IFS= read -r -d '' file; do
              echo "Checking: $file"
              node --experimental-default-type=module --check "$file"
            done
      - name: Verify core project files
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          test -f automation-connector.js
          test -f ffmpeg-editor.js
          test -f merge-editor.js
          test -f auto-montage.js
          test -f ffmpeg/worker.js
          echo "Core files are present."
      - name: Validate video editor wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const html = fs.readFileSync('index.html', 'utf8');
          const ffmpeg = fs.readFileSync('ffmpeg-editor.js', 'utf8');
          const merger = fs.readFileSync('merge-editor.js', 'utf8');
          const montage = fs.readFileSync('auto-montage.js', 'utf8');

          const requiredIds = [
            'loadFFmpeg',
            'mergeLoadFFmpeg',
            'autoMontageRatio',
            'smartAutoMontage'
          ];

          for (const id of requiredIds) {
            if (!html.includes(`id="${id}"`)) {
              throw new Error(`Missing required UI element: ${id}`);
            }
          }

          const ffmpegScript = html.indexOf('src="ffmpeg-editor.js"');
          const mergeScript = html.indexOf('src="merge-editor.js"');
          const montageScript = html.indexOf('src="auto-montage.js"');

          if (ffmpegScript < 0 || mergeScript < 0 || montageScript < 0) {
            throw new Error('One or more video editor scripts are not included in index.html.');
          }

          if (!(ffmpegScript < mergeScript && ffmpegScript < montageScript)) {
            throw new Error('FFmpeg editor must load before merger and Auto Montage.');
          }

          if (!ffmpeg.includes('window.ensureVideoFFmpeg = ensureVideoFFmpeg')) {
            throw new Error('Shared FFmpeg loader is not exposed globally.');
          }

          for (const [name, source] of [['Video Merger', merger], ['Auto Montage', montage]]) {
            if (!source.includes('window.ensureVideoFFmpeg')) {
              throw new Error(`${name} does not use the shared FFmpeg loader.`);
            }
            if (!source.includes('window.videoFFmpegBusy')) {
              throw new Error(`${name} is missing the shared FFmpeg busy lock.`);
            }
          }

          console.log('Video editor wiring checks passed.');
          NODE
