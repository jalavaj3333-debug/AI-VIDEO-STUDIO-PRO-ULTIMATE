name: Project Validation

on:
  push:
    branches:
      - main
      - automation-quality-checks
  pull_request:
    branches:
      - main
      - fix-automation-media-route
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -type f -name '*.js' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print0 | while IFS= read -r -d '' file; do
              echo "Checking: $file"
              node --experimental-default-type=module --check "$file"
            done
      - name: Test automation Worker media route
        run: |
          node --experimental-default-type=module --test cloudflare-worker-automation/tests/*.test.mjs
      - name: Verify core project files
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          test -f automation-connector.js
          test -f ffmpeg-editor.js
          test -f merge-editor.js
          echo "Core files are present."
