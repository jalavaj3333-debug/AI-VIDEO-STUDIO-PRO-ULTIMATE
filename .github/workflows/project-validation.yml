name: Project Validation

on:
  push:
    branches:
      - main
      - automation-quality-checks
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -type f -name '*.js' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print0 | while IFS= read -r -d '' file; do
              echo "Checking: $file"
              node --experimental-default-type=module --check "$file"
            done
      - name: Verify core project files
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          test -f automation-connector.js
          test -f ffmpeg-editor.js
          test -f merge-editor.js
          test -f publish-package.js
          echo "Core files are present."

      - name: Validate publishing package wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('publish-package.js', 'utf8');

          const requiredIds = [
            'publishVideoFile',
            'publishPlatform',
            'publishTitle',
            'publishRightsConfirmed',
            'buildPublishPackage',
            'publishPackageOutput',
            'downloadPublishPackage'
          ];

          for (const id of requiredIds) {
            if (!html.includes(`id="${id}"`)) {
              throw new Error(`Missing publishing UI element: ${id}`);
            }
          }

          if (!html.includes('src="publish-package.js"')) {
            throw new Error('publish-package.js is not included in index.html.');
          }

          if (!js.includes('does not upload, schedule or publish')) {
            throw new Error('Publishing safety notice is missing.');
          }

          const montage = fs.readFileSync('auto-montage.js', 'utf8');
          if (!montage.includes('window.aiVideoStudioLatestExport')) {
            throw new Error('Auto Montage export is not handed off to the publishing workflow.');
          }
          if (!js.includes('window.aiVideoStudioLatestExport')) {
            throw new Error('Publishing workflow does not consume the latest Auto Montage export.');
          }

          console.log('Publishing package and Auto Montage handoff checks passed.');
          NODE

      - name: Validate cloud video pipeline manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('automation-connector.js', 'utf8');
          const required = [
            'pipeline:',
            'scene_images',
            'voiceover',
            'music_and_sfx',
            'render_mp4',
            'publish_package',
            'required_before_publish: true',
            'automatic_upload_enabled: false'
          ];
          for (const value of required) {
            if (!source.includes(value)) throw new Error('Missing pipeline field: ' + value);
          }
          console.log('Cloud video pipeline manifest checks passed.');
          NODE
